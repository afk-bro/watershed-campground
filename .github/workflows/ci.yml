name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

# Cancel in-progress runs for same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Lint and Type Check
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npm run type-check

      - name: Run unit tests
        run: npx vitest run

      - name: Verify tenant boundary invariants
        run: |
          echo "🔍 Verifying multi-tenant safety..."

          # Check 1: All admin routes use requireAdminWithOrg
          node scripts/check-admin-routes.js

          # Check 2: Verify deprecated upload-image is guarded
          if grep -q "migrationGate" app/api/admin/upload-image/route.ts; then
            echo "✅ upload-image is migration-gated"
          else
            echo "❌ FAIL: upload-image missing migrationGate!"
            echo "This endpoint is not multi-tenant safe and MUST be gated."
            exit 1
          fi

          # Check 3: Ensure old availability system is deleted
          if [ -f "lib/availability.ts" ]; then
            echo "❌ FAIL: lib/availability.ts still exists!"
            echo "This file is deprecated. Use lib/availability/engine.ts instead."
            exit 1
          else
            echo "✅ Deprecated availability.ts is deleted"
          fi

          echo "✅ All tenant boundary checks passed"

  # Job 2: E2E Tests with Playwright
  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest

    # Only run if lint/typecheck passes
    needs: lint-and-typecheck

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Assert required Supabase env vars are present
        run: |
          # CI should use hosted Supabase credentials stored in repository secrets.
          test -n "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" || (echo "❌ Missing secret NEXT_PUBLIC_SUPABASE_URL" && exit 1)
          test -n "${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" || (echo "❌ Missing secret NEXT_PUBLIC_SUPABASE_ANON_KEY" && exit 1)
          test -n "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" || (echo "❌ Missing secret SUPABASE_SERVICE_ROLE_KEY" && exit 1)
          echo "✅ Required Supabase secrets are present"

      - name: Create test environment file from secrets
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" > .env.test
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" >> .env.test
          echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> .env.test
          echo "TEST_ADMIN_EMAIL=admin@test.com" >> .env.test
          echo "TEST_ADMIN_PASSWORD=testpass123" >> .env.test
          echo "ADMIN_EMAILS=admin@test.com" >> .env.test

      - name: Verify .env.test file (masked)
        run: |
          echo "Contents of .env.test (with secrets masked):"
          sed 's/=.*/=***MASKED***/' .env.test

      - name: Run Playwright smoke tests
        run: |
          # Run a small deterministic smoke suite on every push/PR to keep CI fast.
          echo "Running Playwright smoke tests"
          npx playwright test tests/admin/smoke.spec.ts
        env:
          CI: true
          # Pass Supabase credentials to Playwright/Next.js webServer from secrets
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TEST_ADMIN_EMAIL: admin@test.com
          TEST_ADMIN_PASSWORD: testpass123

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 30

      # No local Supabase to stop in hosted CI workflow

  # Job 3: Build Check
  build:
    name: Build Check
    runs-on: ubuntu-latest

    needs: lint-and-typecheck

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          # Provide dummy env vars for build
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-key-for-build
          SUPABASE_SERVICE_ROLE_KEY: dummy-key-for-build

  # Note: Lighthouse moved to a separate, scheduled/manual workflow to avoid flaky blocking on pushes.

  # Summary job - requires all jobs to pass
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, e2e-tests, build]
    if: always()

    steps:
      - name: Check CI status
        run: |
          if [ "${{ needs.lint-and-typecheck.result }}" != "success" ] || \
             [ "${{ needs.e2e-tests.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ]; then
            echo "One or more CI jobs failed"
            exit 1
          fi
          echo "All CI jobs passed! ✅"
