name: Lighthouse (nightly/manual)

on:
  workflow_dispatch: {}
  # Nightly cron disabled: wait-for-vercel-preview hits Vercel's protected
  # *.vercel.app URL and times out with 401. Re-enable once we either point
  # at the production custom domain or wire up a Protection Bypass token.
  # schedule:
  #   - cron: '0 4 * * *' # Daily at 04:00 UTC (nightly)

permissions:
  contents: read
  actions: read

jobs:
  lighthouse:
    name: Lighthouse Performance (nightly/manual)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for Vercel Preview Deployment
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.1
        id: vercel-preview
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_timeout: 600
          check_interval: 10

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v10
        with:
          urls: |
            ${{ steps.vercel-preview.outputs.url }}
            ${{ steps.vercel-preview.outputs.url }}/gallery
            ${{ steps.vercel-preview.outputs.url }}/rates
          uploadArtifacts: true
          temporaryPublicStorage: true
          runs: 3

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report-${{ github.run_id }}
          path: .lighthouseci/
          retention-days: 30

      - name: Comment PR (optional)
        if: github.event_name == 'workflow_dispatch' && github.event.client_payload.comment_on_pr == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = process.env.PR_NUMBER || github.context.payload.issue?.number || github.context.payload.pull_request?.number;
            if (!prNumber) return;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `Lighthouse run complete: workflow ${{ github.run_id }}. See artifacts.`
            });
